name: Publish shared config packages

on:
  push:
    branches: [main]
    paths:
      - "packages/tsconfig/**"
      - "packages/prettier-config/**"
      - ".github/workflows/publish-config-packages.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish-tsconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install a Trusted Publishing-compatible npm version
        run: npm install --global npm@^11.5.1
      - name: Test package
        run: npm --prefix packages/tsconfig test
      - name: Publish if this version is not already on npm
        working-directory: packages/tsconfig
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
            exit 0
          fi

          npm publish --access public

  publish-prettier-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install a Trusted Publishing-compatible npm version
        run: npm install --global npm@^11.5.1
      - name: Test package
        run: npm --prefix packages/prettier-config test
      - name: Publish if this version is not already on npm
        working-directory: packages/prettier-config
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
            exit 0
          fi

          npm publish --access public
